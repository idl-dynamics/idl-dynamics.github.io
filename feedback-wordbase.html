<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback &amp; Support - WordBase | IDL Dynamics</title>
    <style>
        :root { --primary-color: #007AFF; --bg-color: #0F172A; --text-color: #F1F5F9; --card-bg: #1E293B; --gray: #94A3B8; }
        body { font-family: 'SF Pro Display', -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; line-height: 1.6; }
        header { padding: 20px 5%; background: rgba(15, 23, 42, 0.9); border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--text-color); text-decoration: none; }
        .logo span { color: var(--primary-color); }
        .container { max-width: 700px; margin: 80px auto; padding: 50px 40px; background: var(--card-bg); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; }
        h1 { color: #FFF; font-size: 2rem; margin-top: 0; margin-bottom: 15px; }
        p { color: var(--gray); font-size: 1.05rem; margin-bottom: 15px; }
        .email-btn { display: inline-block; margin-top: 20px; padding: 14px 32px; background: var(--primary-color); color: #FFF; border-radius: 12px; font-weight: 600; text-decoration: none; font-size: 1.1rem; }
        .email-btn:hover { background: #0063CC; }
        .response-note { margin-top: 30px; font-size: 0.9rem; color: #64748B; }
        footer { text-align: center; padding: 40px; color: var(--gray); font-size: 0.9rem; }
    </style>
</head>
<body>
    <header><a href="/" class="logo">IDL <span>Dynamics</span></a></header>
    <div class="container">
        <h1>WordBase Feedback &amp; Support</h1>
        <p>Found a bug, have a feature idea, or need help with your account? We'd love to hear from you.</p>
        <a href="mailto:idldynamics@gmail.com?subject=WordBase%20Feedback" class="email-btn">idldynamics@gmail.com</a>
        <p class="response-note">We aim to respond to all inquiries within 24-48 hours.</p>
    </div>
    <footer><p>&copy; 2026 IDL Dynamics. All rights reserved.</p></footer>
</body>
</html>
