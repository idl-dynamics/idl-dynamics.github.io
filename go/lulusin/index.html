<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Lulusin</title>
<style>body{margin:0;min-height:100svh;display:grid;place-items:center;font:16px/1.5 system-ui,sans-serif;background:#0f1220;color:#eef}
main{text-align:center;padding:24px}a{display:block;margin:10px auto;padding:12px 20px;max-width:240px;border-radius:12px;background:#4b5cff;color:#fff;text-decoration:none;font-weight:600}</style>
</head><body><main><h1>Lulusin</h1><p>Membuka toko aplikasi…</p><a href="https://apps.apple.com/app/id6808125443">App Store</a><p>Versi Android segera hadir.</p></main>
<script>
// location.replace: geçmişe kayıt bırakmaz, mağazadan geri dönen bu sayfaya düşmez.
// Tıklama sayımı (SOS7): çerezsiz işaret, yalnız bağlantı adı + yönlendiren ALAN ADI; IP/kimlik tutulmaz (sosyal/sunucu/tiklama.py).
(function(){try{var r="";try{r=document.referrer?new URL(document.referrer).hostname:"";}catch(e){}
var u="https://hub.idldynamics.com/sosyal-medya/t.txt?g=lulusin&r="+encodeURIComponent(r);
if(!(navigator.sendBeacon&&navigator.sendBeacon(u)))fetch(u,{mode:"no-cors",keepalive:true,credentials:"omit"});}catch(e){}})();
(function(){var ua=navigator.userAgent||"";
var ios=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
var android=/android/i.test(ua);var play='';
if(ios)location.replace('https://apps.apple.com/app/id6808125443');else if(android){if(play)location.replace(play);}else location.replace('https://apps.apple.com/app/id6808125443');})();
</script></body></html>
