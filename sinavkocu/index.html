<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sınav Koçu</title>
<meta name="description" content="Açıköğretim sınavlarına akıllı hazırlık">

<!-- Sohbet uygulamalarinda baglanti onizlemesi (WhatsApp, Telegram, X) -->
<meta property="og:title" content="Sınav Koçu">
<meta property="og:description" content="Açıköğretim sınavlarına akıllı hazırlık">
<meta property="og:type" content="website">
<meta property="og:url" content="https://idl-dynamics.github.io/sinavkocu">
<meta name="twitter:card" content="summary">

<!-- iOS Safari: uygulama kuruluysa ustte "Aç" seridi cikar.
     ID doldurulmadan ETKISIZDIR, zarar vermez. -->
<meta name="apple-itunes-app" content="app-id=APPLE_APP_ID">

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body{
    margin:0; min-height:100svh; display:grid; place-items:center; padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(135deg,#1B1E3D,#2E2270); color:#F5F5FF; text-align:center;
  }
  .kutu{ width:100%; max-width:380px; }
  h1{ font-size:30px; margin:0 0 6px; letter-spacing:-.5px; }
  p.slogan{ color:#A9AECF; margin:0 0 28px; font-size:15px; }
  a.magaza{
    display:block; padding:15px 20px; margin:10px 0; border-radius:14px;
    background:#4F6AF5; color:#fff; text-decoration:none; font-weight:600; font-size:16px;
  }
  a.magaza.ikincil{ background:rgba(255,255,255,.10); }
  p.not{ color:#7F86AB; font-size:12px; margin-top:22px; line-height:1.5; }
  a.yasal{ color:#7F86AB; }
</style>
</head>
<body>
<div class="kutu">
  <h1>Sınav Koçu</h1>
  <p class="slogan">Açıköğretim sınavlarına akıllı hazırlık</p>

  <a class="magaza" id="ios"     href="APP_STORE_URL">App Store</a>
  <a class="magaza ikincil" id="android" href="PLAY_STORE_URL">Google Play</a>

  <p class="not">
    <a class="yasal" href="/sinavkocu-privacy.html">Gizlilik</a> ·
    <a class="yasal" href="/sinavkocu-terms.html">Kullanım Şartları</a>
  </p>
</div>

<script>
(function () {
  // Cihaza gore TEK ADIMDA magazaya gonder.
  //
  // location.replace kullaniliyor, href DEGIL: gecmise kayit birakmaz,
  // yani kullanici magazadan geri donunce bu sayfaya DUSMEZ.
  //
  // Adresler doldurulmadiysa YONLENDIRME YAPILMAZ ve iki buton da gorunur
  // kalir. Bilincli: yarim bir adrese atmaktansa secenek sunmak iyidir --
  // paylasilan gorsel yillarca dolasabilir, olu yonlendirme geri alinamaz.
  var ua = navigator.userAgent || '';
  var ios = /iPad|iPhone|iPod/.test(ua) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var android = /Android/i.test(ua);

  var bag = ios ? document.getElementById('ios')
          : android ? document.getElementById('android')
          : null;
  if (!bag) return;                              // masaustu: iki butonu da gorsun

  var hedef = bag.getAttribute('href');
  if (!hedef || hedef.indexOf('_URL') !== -1) return;  // adres doldurulmamis

  // Dogru magazayi ustte goster (yonlendirme engellenirse bile isine yarar).
  bag.classList.remove('ikincil');
  location.replace(hedef);
})();
</script>
</body>
</html>
